name: Test exclude skips broken file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create good and broken markdown files
        run: |
          rm -rf md-test-exclude
          mkdir -p md-test-exclude
          printf '# Good\n\nSee [other](./other.md).\n' > md-test-exclude/README.md
          printf '# Other\n\nNothing here.\n' > md-test-exclude/other.md
          printf '# Broken\n\nSee [missing](./does-not-exist.md).\n' > md-test-exclude/broken-file.md
          chmod -R a+rX md-test-exclude
      - id: action
        uses: .
        with:
          search_paths: md-test-exclude
          exclude: broken-file.md
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with broken file excluded"
            exit 1
          fi
          echo "PASS"
