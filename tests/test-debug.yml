name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create test markdown file with valid links
        run: |
          mkdir -p /tmp/md-debug-test
          cat > /tmp/md-debug-test/README.md << 'EOF'
          # Test Document

          This is a test document with a valid link.

          [GitHub](https://github.com)
          EOF
      - id: action
        uses: .
        with:
          debug: "true"
          search_paths: /tmp/md-debug-test
        continue-on-error: true
      - name: Assert action ran with debug mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with debug input set"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
