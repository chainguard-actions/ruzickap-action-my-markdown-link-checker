name: Test exclude - skip files with broken links
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          search_paths: ${{ github.workspace }}/tests/fixtures/exclude
          exclude: "broken.md"
          quiet: "true"

      - name: Assert action succeeded (broken file was excluded)
        run: |
          echo "Action completed successfully - broken file was excluded"
          echo "PASS"
