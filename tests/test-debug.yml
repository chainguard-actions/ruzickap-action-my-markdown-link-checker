name: Test debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple markdown file with a valid link
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/debug-md"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/debug-md/README.md" <<'EOF'
          # Test

          [Example](https://example.com)
          EOF

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          debug: "true"
          search_paths: "${{ github.workspace }}/hardened/tests/fixtures/debug-md"

      - name: Assert action completed successfully with debug mode
        run: |
          echo "Action completed with debug mode enabled"
          echo "PASS"
