name: Test basic usage - check markdown with valid links
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action on specific search path with valid markdown
        id: action
        uses: .
        with:
          search_paths: ${{ github.workspace }}/tests/fixtures/basic

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error"
