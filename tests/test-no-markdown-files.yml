name: Test no markdown files fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create directory without markdown files
        run: |
          rm -rf md-test-empty
          mkdir -p md-test-empty
          echo "not markdown" > md-test-empty/notes.txt
          chmod -R a+rX md-test-empty
      - id: action
        uses: .
        continue-on-error: true
        with:
          search_paths: md-test-empty
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when no Markdown files are found"
            exit 1
          fi
          echo "PASS"
