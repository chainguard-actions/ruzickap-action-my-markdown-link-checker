name: Test custom fd_cmd_params
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .markdown file (valid) and .md file (broken)
        run: |
          rm -rf md-test-fd
          mkdir -p md-test-fd
          printf '# Good\n\nSee [other](./other.markdown).\n' > md-test-fd/README.markdown
          printf '# Other\n\nNothing.\n' > md-test-fd/other.markdown
          # A broken .md file that must NOT be scanned with the custom extension
          printf '# Broken\n\nSee [missing](./does-not-exist.md).\n' > md-test-fd/broken.md
          chmod -R a+rX md-test-fd
      - id: action
        uses: .
        with:
          search_paths: md-test-fd
          fd_cmd_params: ". -0 --extension markdown --type f --hidden"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success (only .markdown files should be scanned)"
            exit 1
          fi
          echo "PASS"
