name: Test broken link fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create markdown file with a broken local link
        run: |
          rm -rf md-test-broken
          mkdir -p md-test-broken
          printf '# Broken\n\nSee [missing](./does-not-exist.md).\n' > md-test-broken/README.md
          chmod -R a+rX md-test-broken
      - id: action
        uses: .
        continue-on-error: true
        with:
          search_paths: md-test-broken
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for broken link"
            exit 1
          fi
          echo "PASS"
