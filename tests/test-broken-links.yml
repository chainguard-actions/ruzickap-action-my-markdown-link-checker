name: Test broken links - action fails on broken links
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          search_paths: ${{ github.workspace }}/tests/fixtures/broken
          quiet: "true"

      - name: Assert action failed due to broken links
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on broken links"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed on broken links but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
