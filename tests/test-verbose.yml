name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with verbose mode enabled
        id: action
        uses: .
        with:
          search_paths: ${{ github.workspace }}/tests/fixtures/verbose
          verbose: "true"

      - name: Assert action completed successfully in verbose mode
        run: |
          echo "PASS: action completed in verbose mode without error"
