name: Test verbose, debug and quiet flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create markdown files with valid local links
        run: |
          rm -rf md-test-flags
          mkdir -p md-test-flags
          printf '# Flags\n\nSee [other](./other.md).\n' > md-test-flags/README.md
          printf '# Other\n\nBack to [readme](./README.md).\n' > md-test-flags/other.md
          chmod -R a+rX md-test-flags
      - id: action
        uses: .
        with:
          search_paths: md-test-flags
          verbose: "true"
          quiet: "true"
          debug: "true"
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
