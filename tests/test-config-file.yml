name: Test config_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom config file that ignores all HTTP links
        id: action
        uses: .
        with:
          search_paths: ${{ github.workspace }}/tests/fixtures/config
          config_file: ${{ github.workspace }}/tests/fixtures/config/mlc_config.json

      - name: Assert action completed successfully with config file
        run: |
          echo "PASS: action completed successfully with custom config file"
