name: Test exclude functionality
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with broken file excluded
        id: action
        uses: .
        with:
          search_paths: ${{ github.workspace }}/tests/fixtures/exclude
          exclude: broken.md

      - name: Assert action completed successfully (broken file was excluded)
        run: |
          echo "PASS: action completed successfully with broken file excluded"
