name: Test verbose mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          search_paths: ${{ github.workspace }}/tests/fixtures/verbose
          verbose: "true"

      - name: Assert action succeeded with verbose mode
        run: |
          echo "Action completed successfully in verbose mode"
          echo "PASS"
