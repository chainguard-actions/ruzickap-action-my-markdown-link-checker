name: Test quiet mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with quiet mode enabled
        id: action
        uses: .
        with:
          search_paths: ${{ github.workspace }}/tests/fixtures/quiet
          quiet: "true"

      - name: Assert action completed successfully in quiet mode
        run: |
          echo "PASS: action completed in quiet mode without error"
