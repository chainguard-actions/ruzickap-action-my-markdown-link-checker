name: Test fd_cmd_params custom parameters
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom fd_cmd_params targeting specific directory
        id: action
        uses: .
        with:
          fd_cmd_params: ". -0 --extension md --type f --hidden --no-ignore ${{ github.workspace }}/tests/fixtures/fd-params"

      - name: Assert action completed successfully with custom fd params
        run: |
          echo "PASS: action completed successfully with custom fd_cmd_params"
